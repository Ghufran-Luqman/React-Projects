<!DOCTYPE html>
<html>
    <head>
        <script src="https://unpkg.com/react@16/umd/react.development.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@16/umd/react-dom.development.js" crossorigin></script>
        <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
        <title>Flashcards 2</title>
        <style>
            html {
                font-size: 36px;
            }
            body {
                background-color: rgb(103, 198, 179);
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            table, td, th {
                border: 0.05rem solid black;
            }

            table {
                border-collapse: collapse;
            }

            td, th {
                padding: 0.5rem;
            }

            #app {
                background-color: aliceblue;
                padding: 2rem;
                border-radius: 1rem;
                max-width: 20rem;
                display: flex;
                flex-direction: column;
                align-items: center;
            }

            button {
                width: 3rem;
                max-height: 3rem;
                height: fit-content;
                border-radius: 0.5rem;
                border: 0.065rem solid black;
                transition: border 0.2s ease;
            }

            button:hover {
                border: 0.065rem solid rgb(103, 198, 179);
            }

            span {
                font-size: 0.5rem;
                color: black;
                transition: color 0.1s;
            }

            button:hover span {
                color: rgb(103, 198, 179);
            }

            #form {
                margin-bottom: 0.5rem;
                display: flex;
                flex-direction: row;
                align-items: center;
            }

            input {
                text-align: center;
                margin-right: 0.2rem;
                width: 3rem;
                height: 1rem;
                border-radius: 0.3rem;
                border: 0.065rem solid black;
                transition: border 0.2s ease;
            }

            #inputs {
                display: flex;
                flex-direction: row;
                margin-right: 0.5rem;
            }

            #underhr {
                display: flex;
                flex-direction: column;
                align-items: center;
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <script type="text/babel">

            class CardEditor extends React.Component {
                constructor(props) {
                    super(props)
                    this.state = {
                        frontInput: "",
                        backInput: ""
                    }
                }

                render() {
                    const rows = this.props.cards.map((card, i) => {
                        return (
                            <tr key={i}>
                                <td>{card.front}</td>
                                <td>{card.back}</td>
                                <td><button data-index={i} onClick={this.deleteCard}><span>Delete</span></button></td>
                            </tr>
                        )
                    })

                    return (
                        <div>
                            <h1>Card Editor</h1>
                            <table>
                                <thead>
                                    <tr>
                                        <th>Front</th>
                                        <th>Back</th>
                                        <th>Delete</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {rows}
                                </tbody>
                            </table>
                            <hr />
                            <div id='underhr'>
                                <div id='form'>
                                    <div id='inputs'>
                                        <input autoFocus name="front" placeholder="Front of new card" value={this.state.frontInput} onChange={this.updateResponse}></input>
                                        <input name="back" placeholder="Back of new card" value={this.state.backInput} onChange={this.updateResponse}></input>
                                    </div>
                                    <button onClick={this.addCard}><span>Add Card</span></button>
                                </div>
                                <button onClick={this.props.switchMode}><span>Go to viewer</span></button>
                            </div>
                        </div>
                    )
                }

                updateResponse = (event) => {
                    if (event.target.name == "front") {
                        this.setState({
                            frontInput: event.target.value
                        })
                    } else {
                        this.setState({
                            backInput: event.target.value
                        })
                    }
                }

                addCard = () => {
                    const newCard = {front: this.state.frontInput, back: this.state.backInput};
                    this.props.addCard(newCard)
                    this.setState({
                        frontInput: "",
                        backInput: ""
                    })
                }

                deleteCard = (event) => {
                    this.props.deleteCard(event.target.dataset.index)
                }
                
            }

            class CardViewer extends React.Component {
                render() {
                    return (
                        <div>
                            This is the Viewer.
                            <hr />
                            <button onClick={this.props.switchMode}><span>Go to editor</span></button>
                        </div>
                    );
                }
            }

            class App extends React.Component {
                constructor(props) {
                    super(props);
                    this.state = {
                        editor: true,
                        cards: []
                    };
                }


                render() {
                    if (this.state.editor) {
                        return (
                            <CardEditor 
                                cards = {this.state.cards}
                                switchMode = {this.switchMode}
                                deleteCard = {this.deleteCard}
                                addCard = {this.addCard}
                            />
                        );
                    } else {
                        return (
                            <CardViewer
                                cards = {this.state.cards}
                                switchMode = {this.switchMode}
                            />
                        );
                    }
                }

                addCard = (newCard) => {
                    // newCard = {front: "x", back: "y"}
                    this.setState(state => {
                        const cardsCopy = [...state.cards, newCard];
                        return {
                            cards: cardsCopy
                        }
                    })
                }

                deleteCard = (index) => {
                    this.setState(state => {
                        const cardsCopy = [...state.cards];
                        cardsCopy.splice(index, 1);
                        return {
                            cards: cardsCopy
                        }
                    })
                }

                switchMode = () => {
                    this.setState(state => ({
                        editor: !state.editor
                    }));
                }
            }

            ReactDOM.render(<App />, document.querySelector("#app"));
        </script>
    </body>
</html>

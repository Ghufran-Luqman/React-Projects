<!DOCTYPE html>
<html>
    <head>
        <script src="https://unpkg.com/react@16/umd/react.development.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@16/umd/react-dom.development.js" crossorigin></script>
        <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
        <title>Flashcards 2</title>
        <link rel="stylesheet" href="css/reset.css">
        <link rel="stylesheet" href="css/main.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="app"></div>
        <script type="text/babel">

            class CardEditor extends React.Component {
                constructor(props) {
                    super(props)
                    this.state = {
                        id: Date.now(),
                        frontInput: "",
                        backInput: ""
                    }
                }

                render() {
                    const rows = this.props.cards.map((card) => {
                        return (
                            <tr key={card.id}>
                                <td>{card.front}</td>
                                <td>{card.back}</td>
                                <td><button class='button' data-id={card.id} onClick={this.deleteCard}><span>Delete</span></button></td>
                            </tr>
                        )
                    })

                    return (
                        <div>
                            <h1>Card Editor</h1>
                            <table>
                                <thead>
                                    <tr>
                                        <th>Front</th>
                                        <th>Back</th>
                                        <th>Delete</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {rows}
                                </tbody>
                            </table>
                            <hr />
                            <div id='underhr'>
                                <div id='form'>
                                    <div id='inputs'>
                                        <input autoFocus name="front" placeholder="Front" value={this.state.frontInput} onChange={this.updateResponse}></input>
                                        <input name="back" placeholder="Back" value={this.state.backInput} onChange={this.updateResponse}></input>
                                    </div>
                                    <button class='button' onClick={this.addCard}><span>Add Card</span></button>
                                </div>
                                <button class='button' onClick={this.props.switchMode}><span>Go to viewer</span></button>
                            </div>
                        </div>
                    )
                }

                updateResponse = (event) => {
                    if (event.target.name == "front") {
                        this.setState({
                            frontInput: event.target.value
                        })
                    } else {
                        this.setState({
                            backInput: event.target.value
                        })
                    }
                }

                addCard = () => {
                    if (this.state.frontInput.length > 0 && this.state.backInput.length > 0) {
                        const newCard = {id: this.state.id, front: this.state.frontInput, back: this.state.backInput};
                        this.props.addCard(newCard)
                        this.setState({
                            frontInput: "",
                            backInput: ""
                        })
                    }
                }

                deleteCard = (event) => {
                    this.props.deleteCard(parseInt(event.currentTarget.getAttribute("data-id")))
                }
                
            }

            class CardViewer extends React.Component {
                constructor(props) {
                    super(props)
                    this.state = {
                        front: true,
                        cardIndex: 0
                    }
                }

                render() {

                    const frontOrBack = () => {
                        if (this.state.front) {
                            return (
                                <div>
                                    <div id='card'>
                                        <button class='viewFlashcardButton' onClick={this.switchFront}>
                                            <span>{this.props.cards[this.state.cardIndex].front}</span>
                                        </button>
                                    </div>
                                </div>
                            )
                        } else {
                            return (
                                <div>
                                    <div id='card'>
                                        <button class='viewFlashcardButton' onClick={this.switchFront}>
                                            <span>{this.props.cards[this.state.cardIndex].back}</span>
                                        </button>
                                    </div>
                                </div>
                            )
                        }
                    }

                    

                    return (
                        <main>
                            <h1>This is the Viewer.</h1>
                            {
                                !(this.props.cards.length === 0) ?

                                <div>
                                    {frontOrBack()}
                                    <div id='cardControls'>
                                        {this.state.front ? 
                                            <div><button class='button' onClick={this.switchFront}><span>Show back</span></button></div>
                                            : 
                                            <div>
                                                <button class='button' onClick={this.switchFront}><span>Show front</span></button>
                                            </div>
                                        }
                                        {!(this.props.cards.length <= 1) ?
                                            <div>
                                                <button className='button' onClick={this.shuffle}><span>Shuffle</span></button>
                                            </div>
                                            :
                                            null
                                        }
                                        <div id='arrows'>
                                            {this.state.cardIndex > 0 ? 
                                                <div><button class='button' onClick={this.decrementCard}><span>&lt;</span></button></div> 
                                                : 
                                                null
                                            }

                                            {!(this.state.cardIndex === this.props.cards.length-1) ?
                                                <div><button class='button' onClick={this.incrementCard}><span>&#62;</span></button></div>
                                                :
                                                null
                                            }
                                        </div>
                                    </div>
                                </div>

                                :

                                <div id='noCards'>
                                    <h4>No Cards!</h4>
                                    <p>Add some!</p>
                                </div>
                            }
                            <hr />
                            <button class='button' onClick={this.props.switchMode}><span>Go to editor</span></button>
                        </main>
                    );
                }

                shuffle = () => {
                    const randomIndex = this.randomIndexThatIsntTheSame()
                    console.log(randomIndex)
                    this.setState(state => {
                        return {
                            cardIndex: randomIndex,
                            front: true
                        }
                    })
                }

                randomIndexThatIsntTheSame = () => {
                    const { cards } = this.props
                    if (cards.length <= 1) {
                        return this.state.cardIndex
                    }
                    let randomIndex
                    do {
                        randomIndex = Math.floor(Math.random() * cards.length)
                    } while (randomIndex === this.state.cardIndex)
                    return randomIndex
                }

                decrementCard = () => {
                    this.setState(state => {
                        return {
                            cardIndex: state.cardIndex - 1,
                            front: true
                        }
                    })
                }
                
                incrementCard = () => {
                    this.setState(state => {
                        return {
                            cardIndex: state.cardIndex + 1,
                            front: true
                        }
                    })
                }

                switchFront = () => {
                    this.setState(state => ({
                        front: !state.front
                    }))
                }
            }

            class App extends React.Component {
                constructor(props) {
                    super(props);
                    this.state = {
                        editor: true,
                        cards: [{id: 1, front: "1+1", back: "2"},
                                {id: 2, front: "2+2", back: "4"},
                                {id: 3, front: "4+4", back: "8"},
                                {id: 4, front: "8+8", back: "16"},
                                {id: 5, front: "16+16", back: "32"},
                                {id: 6, front: "Explain how Juliet's feelings were portrayed in Act 2 of Shakespeare's 'Romeo and Juliet' [30 marks]", back: "At the beginning of Act 2, Juliet seems extremely joyful at the hint of Romeo's interest in her, as denoted by the quote '...', which implies..."}
                        ]
                    };
                }


                render() {
                    if (this.state.editor) {
                        return (
                            <CardEditor 
                                cards = {this.state.cards}
                                switchMode = {this.switchMode}
                                deleteCard = {this.deleteCard}
                                addCard = {this.addCard}
                            />
                        );
                    } else {
                        return (
                            <CardViewer
                                cards = {this.state.cards}
                                switchMode = {this.switchMode}
                            />
                        );
                    }
                }

                addCard = (newCard) => {
                    // newCard = {id: x, front: "y", back: "z"}
                    this.setState(state => {
                        const cardsCopy = [...state.cards, newCard];
                        return {
                            cards: cardsCopy
                        }
                    })
                }

                deleteCard = (idToRemove) => {
                    const isNotTheDeletedCard = (card) => card.id !== idToRemove;
                    this.setState(state => ({
                        cards: (state.cards.filter(isNotTheDeletedCard))
                    }))
                }

                switchMode = () => {
                    this.setState(state => ({
                        editor: !state.editor
                    }));
                }
            }

            ReactDOM.render(<App />, document.querySelector("#app"));
        </script>
    </body>
</html>

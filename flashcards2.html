<!DOCTYPE html>
<html>
    <head>
        <script src="https://unpkg.com/react@16/umd/react.development.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@16/umd/react-dom.development.js" crossorigin></script>
        <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
        <title>Flashcards 2</title>
        <link rel="stylesheet" href="css/reset.css">
        <link rel="stylesheet" href="css/main.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Geist+Pixel&display=swap" rel="stylesheet">
    </head>
    <body>
        <div id="app"></div>
        <script type="text/babel">

            class CardEditor extends React.Component {
                constructor(props) {
                    super(props)
                    this.state = {
                        frontInput: "",
                        backInput: ""
                    }
                }

                render() {
                    const rows = this.props.cards.map((card, i) => {
                        return (
                            <tr key={i}>
                                <td>{card.front}</td>
                                <td>{card.back}</td>
                                <td><button data-index={i} onClick={this.deleteCard}><span>Delete</span></button></td>
                            </tr>
                        )
                    })

                    return (
                        <div>
                            <h1>Card Editor</h1>
                            <table>
                                <thead>
                                    <tr>
                                        <th>Front</th>
                                        <th>Back</th>
                                        <th>Delete</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    {rows}
                                </tbody>
                            </table>
                            <hr />
                            <div id='underhr'>
                                <div id='form'>
                                    <div id='inputs'>
                                        <input autoFocus name="front" placeholder="Front" value={this.state.frontInput} onChange={this.updateResponse}></input>
                                        <input name="back" placeholder="Back" value={this.state.backInput} onChange={this.updateResponse}></input>
                                    </div>
                                    <button onClick={this.addCard}><span>Add Card</span></button>
                                </div>
                                <button onClick={this.props.switchMode}><span>Go to viewer</span></button>
                            </div>
                        </div>
                    )
                }

                updateResponse = (event) => {
                    if (event.target.name == "front") {
                        this.setState({
                            frontInput: event.target.value
                        })
                    } else {
                        this.setState({
                            backInput: event.target.value
                        })
                    }
                }

                addCard = () => {
                    if (this.state.frontInput.length > 0 && this.state.backInput.length > 0) {
                        const newCard = {front: this.state.frontInput, back: this.state.backInput};
                        this.props.addCard(newCard)
                        this.setState({
                            frontInput: "",
                            backInput: ""
                        })
                    }
                }

                deleteCard = (event) => {
                    this.props.deleteCard(event.target.dataset.index)
                }
                
            }

            class CardViewer extends React.Component {
                constructor(props) {
                    super(props)
                    this.state = {
                        front: true,
                        cardIndex: 0
                    }
                }

                render() {
                    // const displayCard = this.props.cards.map((card, i) => {
                    //     return (
                    //         <div key={i}>
                    //             {card.front}
                    //         </div>
                    //     )
                    // })

                    const frontOrBack = () => {
                        if (this.state.front) {
                            return (
                                <div>
                                    <div id='card'>
                                        {this.props.cards[this.state.cardIndex].front}
                                    </div>
                                </div>
                            )
                        } else {
                            return (
                                <div>
                                    <div id='card'>
                                        {this.props.cards[this.state.cardIndex].back}
                                    </div>
                                </div>
                            )
                        }
                    }

                    

                    return (
                        <div>
                            <h1>This is the Viewer.</h1>
                            {
                                !(this.props.cards.length === 0) ?

                                <div>
                                {frontOrBack()}
                                <div id='cardControls'>
                                    {this.state.front ? 
                                        <div><button onClick={this.switchFront}><span>Show back</span></button></div>
                                        : 
                                        <div>
                                            <button onClick={this.switchFront}><span>Show front</span></button>
                                        </div>
                                    }
                                    <div id='arrows'>
                                        {this.state.cardIndex > 0 ? 
                                            <div><button onClick={this.decrementCard}><span>&lt;</span></button></div> 
                                            : 
                                            null
                                        }

                                        {!(this.state.cardIndex === this.props.cards.length-1) ?
                                            <div><button onClick={this.incrementCard}><span>&#62;</span></button></div>
                                            :
                                            null
                                        }
                                    </div>
                                </div>
                                </div>

                                :

                                <div id='noCards'>
                                    <h4>No Cards!</h4>
                                    <p>Add some!</p>
                                </div>
                            }
                            <hr />
                            <button onClick={this.props.switchMode}><span>Go to editor</span></button>
                        </div>
                    );
                }

                decrementCard = () => {
                    this.setState(state => {
                        return {
                            cardIndex: state.cardIndex - 1,
                            front: true
                        }
                    })
                }
                
                incrementCard = () => {
                    this.setState(state => {
                        return {
                            cardIndex: state.cardIndex + 1,
                            front: true
                        }
                    })
                }

                switchFront = () => {
                    this.setState(state => ({
                        front: !state.front
                    }))
                }
            }

            class App extends React.Component {
                constructor(props) {
                    super(props);
                    this.state = {
                        editor: true,
                        cards: [{front: "1+1", back: "2"},
                                {front: "2+2", back: "4"},
                                {front: "Explain how Juliet's feelings were portrayed in Act 2 of Shakespeare's 'Romeo and Juliet' [30 marks]", back: "At the beginning of Act 2, Juliet seems extremely joyful at the hint of Romeo's interest in her, as denoted by the quote '...' which implies..."}
                        ]
                    };
                }


                render() {
                    if (this.state.editor) {
                        return (
                            <CardEditor 
                                cards = {this.state.cards}
                                switchMode = {this.switchMode}
                                deleteCard = {this.deleteCard}
                                addCard = {this.addCard}
                            />
                        );
                    } else {
                        return (
                            <CardViewer
                                cards = {this.state.cards}
                                switchMode = {this.switchMode}
                            />
                        );
                    }
                }

                addCard = (newCard) => {
                    // newCard = {front: "x", back: "y"}
                    this.setState(state => {
                        const cardsCopy = [...state.cards, newCard];
                        return {
                            cards: cardsCopy
                        }
                    })
                }

                deleteCard = (index) => {
                    this.setState(state => {
                        const cardsCopy = [...state.cards];
                        cardsCopy.splice(index, 1);
                        return {
                            cards: cardsCopy
                        }
                    })
                }

                switchMode = () => {
                    this.setState(state => ({
                        editor: !state.editor
                    }));
                }
            }

            ReactDOM.render(<App />, document.querySelector("#app"));
        </script>
    </body>
</html>

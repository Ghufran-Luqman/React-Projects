<!DOCTYPE html>
<html>
    <head>
        <script src="https://unpkg.com/react@16/umd/react.development.js" crossorigin></script>
        <script src="https://unpkg.com/react-dom@16/umd/react-dom.development.js" crossorigin></script>
        <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
        <title>To-Do List</title>
        <style>
            body {
                background-color: rgb(196, 174, 215);
            }
        </style>
    </head>
    <body>
        <div id="app"></div>
        <script type="text/babel">

            class App extends React.Component {

                constructor(props) {
                    super(props);
                    this.state = {
                        tasks: [],
                        input: "",
                        numberOfTasks: 0
                    };
                }
            
                render() {
                    return (
                        <div>
                            <h1>Tasks</h1>
                            <ul>
                                {this.state.tasks.map((task, i) =>
                                    <li key={i}>
                                        {task}
                                        <button onClick={() => this.deleteTask(i)}>Delete</button>
                                    </li>
                                )}
                            </ul>
                            <form onSubmit={this.addTask}>
                                <input onChange={this.handleChange} value={this.state.input} autoFocus />
                                <button type="submit">Add Task</button>
                            </form>
                            Number of Tasks: {this.state.numberOfTasks}
                        </div>
                    );
                }

                deleteTask = (i) => {
                    this.setState(state => {
                        const tasksCopy = [...state.tasks];
                        tasksCopy.splice(i, 1);
                        return {
                            tasks: tasksCopy,
                            numberOfTasks: state.numberOfTasks - 1
                        };
                    });
                }

                handleChange = (event) => {
                    this.setState({
                        input: event.target.value
                    });
                }

                addTask = (event) => {
                    event.preventDefault();
                    this.setState(state => ({
                        tasks: [...state.tasks, state.input],
                        numberOfTasks: state.numberOfTasks + 1,
                        input: ""
                    }));
                }

            }

            ReactDOM.render(<App />, document.querySelector("#app"));
        </script>
    </body>
</html>
